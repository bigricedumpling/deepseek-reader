<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>检索质量监控台</title>
    <style>
      /* 独立原件：样式与交互全部自带，不依赖任何外部资源。 */
      :root {
        --ds: #4d6bfe;
        --ds-2: #8fa3ff;
        --ds-soft: rgba(77, 107, 254, 0.08);
        --ink: #1a1a1a;
        --text: #2f2f2f;
        --sub: #6b6b6b;
        --faint: #9a9a9a;
        --line: #e8e8e8;
        --line-soft: #f2f2f2;
        --surface: #fff;
        --panel: #fafafa;
        --field: #f5f5f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--surface); color: var(--text);
        font: 13px/1.7 "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px 56px; }

      header.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0 16px; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand b { font-size: 15px; font-weight: 600; color: var(--ink); }
      .brand span { font-size: 12px; color: var(--faint); }
      #clock { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

      /* 指标条：1px 间隙当分隔线 */
      .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 24px; }
      .metric { background: var(--surface); padding: 15px 17px 14px; }
      .metric .k { margin: 0 0 7px; font-size: 12px; color: var(--sub); }
      .metric .v { font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.4px; line-height: 1.2; font-variant-numeric: tabular-nums; }
      .metric .v small { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 2px; }
      .metric .d { margin-top: 5px; font-size: 11.5px; color: var(--faint); }
      .up { color: var(--ds); } .down { color: var(--sub); }

      /* 趋势与占比并排 */
      .grid2 { display: grid; grid-template-columns: 1.75fr 1fr; gap: 18px; margin-top: 18px; }
      .card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
      .card .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 15px 10px; border-bottom: 1px solid var(--line-soft); }
      .card .hd h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); }
      .card .hd span { font-size: 11.5px; color: var(--faint); }
      .card .bd { padding: 14px 15px 15px; }
      svg { display: block; width: 100%; height: auto; }
      .legend { display: flex; gap: 14px; margin-top: 9px; font-size: 11.5px; color: var(--sub); }
      .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 18px; }
      th { text-align: left; font-weight: 500; color: var(--faint); font-size: 11.5px; padding: 0 10px 8px 0; border-bottom: 1px solid var(--line); }
      td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
      tbody tr:last-child td { border-bottom: 0; }
      td.q { color: var(--ink); }
      .num { text-align: right; } th.num { text-align: right; }

      /* 手机：真机比例的外框，里面是一屏完整的 app 布局 */
      h2.sec { margin: 40px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.2px; }
      .phones { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 18px; }
      .device { width: 300px; flex: none; }
      .device .shell {
        border: 1px solid var(--line); border-radius: 32px; padding: 10px; background: var(--surface);
        /* 听筒与边框的细节，避免看起来像一张截图 */
        position: relative;
      }
      .device .notch { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 78px; height: 18px; border-radius: 0 0 12px 12px; background: var(--panel); border: 1px solid var(--line); border-top: 0; }
      .device .screen { position: relative; border-radius: 24px; overflow: hidden; background: #fff; height: 600px; display: flex; flex-direction: column; border: 1px solid var(--line-soft); }
      .device .cap { margin: 10px 0 0; text-align: center; font-size: 11.5px; color: var(--faint); }

      /* 手机内部：状态栏 → 导航栏 → 可滚动正文 → 底部标签 */
      .sbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 6px; font-size: 11px; color: var(--ink); font-weight: 500; }
      .sbar .rt { display: flex; gap: 5px; align-items: center; color: var(--sub); font-weight: 400; }
      .sbar .batt { width: 20px; height: 10px; border: 1px solid var(--sub); border-radius: 2.5px; position: relative; }
      .sbar .batt::after { content: ''; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 12px; background: var(--ds); border-radius: 1px; }
      .nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 14px; border-bottom: 1px solid var(--line-soft); }
      .nav h3 { margin: 0; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; }
      .nav .act { display: flex; gap: 12px; color: var(--sub); font-size: 16px; }
      .body { flex: 1; overflow-y: auto; padding: 14px 18px 10px; }
      .seg { display: flex; gap: 0; background: var(--field); border-radius: 9px; padding: 2px; margin-bottom: 14px; }
      .seg button { flex: 1; font: inherit; font-size: 12.5px; padding: 6px 0; border: 0; border-radius: 7px; background: none; color: var(--sub); cursor: pointer; }
      .seg button[aria-current="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
      .tile { border: 1px solid var(--line); border-radius: 11px; padding: 13px 14px; margin-bottom: 10px; }
      .tile .t { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--sub); }
      .tile .big { margin-top: 6px; font-size: 27px; font-weight: 600; color: var(--ink); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
      .tile .big small { font-size: 13px; font-weight: 400; color: var(--sub); margin-left: 2px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
      .row:last-child { border-bottom: 0; }
      .row .nm { font-size: 13px; color: var(--ink); }
      .row .sub { margin-top: 3px; font-size: 11px; color: var(--faint); }
      .row .val { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
      .chip { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; background: var(--ds-soft); color: var(--ds); }
      .chip.warn { background: var(--field); color: var(--sub); }
      .tabbar { display: flex; border-top: 1px solid var(--line-soft); padding: 8px 0 14px; }
      .tabbar button { flex: 1; font: inherit; font-size: 10.5px; border: 0; background: none; color: var(--faint); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .tabbar button i { width: 18px; height: 18px; border-radius: 5px; background: var(--line-soft); display: block; }
      .tabbar button[aria-current="true"] { color: var(--ds); }
      .tabbar button[aria-current="true"] i { background: var(--ds-soft); border: 1px solid var(--ds-2); }
      .home-bar { height: 4px; width: 116px; border-radius: 2px; background: var(--ink); opacity: .18; margin: 0 auto 8px; }

      @media (max-width: 900px) {
        .wrap { padding: 0 18px 40px; }
        .metrics { grid-template-columns: repeat(2, 1fr); }
        .grid2 { grid-template-columns: 1fr; }
        .phones { justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand"><b>检索质量监控台</b><span>近 24 小时</span></div>
        <span id="clock">--:--:--</span>
      </header>

      <section class="metrics">
        <article class="metric"><p class="k">召回率 @10</p><div class="v">0.913</div><div class="d"><b class="up">+1.8%</b></div></article>
        <article class="metric"><p class="k">P95 延迟</p><div class="v">412<small>ms</small></div><div class="d"><b class="down">−36ms</b></div></article>
        <article class="metric"><p class="k">重排命中率</p><div class="v">0.768</div><div class="d"><b class="down">−0.9%</b></div></article>
        <article class="metric"><p class="k">零结果率</p><div class="v">2.4<small>%</small></div><div class="d"><b class="down">−0.6%</b></div></article>
      </section>

      <div class="grid2">
        <div class="card">
          <div class="hd"><h2>召回率与延迟</h2><span>%s</span></div>
          <div class="bd">
            <div id="trend"></div>
            <div class="legend">
              <span><i style="background:#4d6bfe"></i>召回率</span>
              <span><i style="background:#d5d5d5"></i>P95 延迟</span>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="hd"><h2>切分策略</h2><span>按请求数</span></div>
          <div class="bd">
            <div id="donut"></div>
            <div class="legend" id="donutLegend"></div>
          </div>
        </div>
      </div>

      <table>
        <thead><tr><th>低分查询</th><th>策略</th><th class="num">召回率</th><th class="num">延迟</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>

      <h2 class="sec">移动端</h2>
      <div class="phones">
        <div class="device">
          <div class="shell">
            <div class="notch"></div>
            <div class="screen">
              <div class="sbar"><span>9:41</span><span class="rt">5G<span class="batt"></span></span></div>
              <div class="nav">
                <h3>质量概览</h3>
                <span class="act">⋯</span>
              </div>
              <div class="body">
                <div class="seg" id="m-seg"></div>
                <div id="m-view"></div>
              </div>
              <div class="tabbar">
                <button aria-current="true"><i></i>概览</button>
                <button><i></i>样本</button>
                <button><i></i>设置</button>
              </div>
              <div class="home-bar"></div>
            </div>
          </div>
          <p class="cap">概览 · 指标与低分样本</p>
        </div>
        <div class="device">
          <div class="shell">
            <div class="notch"></div>
            <div class="screen">
              <div class="sbar"><span>9:41</span><span class="rt">5G<span class="batt"></span></span></div>
              <div class="nav">
                <h3>低分样本</h3>
                <span class="act">⋯</span>
              </div>
              <div class="body" id="m-list"></div>
              <div class="tabbar">
                <button><i></i>概览</button>
                <button aria-current="true"><i></i>样本</button>
                <button><i></i>设置</button>
              </div>
              <div class="home-bar"></div>
            </div>
          </div>
          <p class="cap">样本 · 列表与分段</p>
        </div>
      </div>
    </div>

    <script>
    /* 数据是静态的：这是一份演示原件，不连后端。 */
    (function () {
      const NS = 'http://www.w3.org/2000/svg';
      const svgEl = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
      const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

      const TREND = [0.86,0.88,0.87,0.89,0.91,0.90,0.88,0.87,0.89,0.92,0.93,0.91,0.90,0.92,0.94,0.93,0.91,0.90,0.92,0.93,0.95,0.94,0.92,0.913];
      const LAT = [448,431,455,420,405,398,441,462,428,392,381,405,418,396,372,385,409,422,398,381,364,371,395,412];
      const DONUT = [['层级',55,'#4d6bfe'],['语义',26,'#8fa3ff'],['定长',19,'#d5d9e6']];
      const ROWS = [
        ['检索任务的分块粒度','层级','0.38','884ms'],
        ['平台限流之后的重试','语义','0.41','612ms'],
        ['缓存命中与冷启动','层级','0.44','530ms'],
        ['多路召回融合顺序','定长','0.47','498ms'],
      ];

      /* 单调三次插值：曲线不过冲，形态稳定 */
      function smooth(vals, x, y) {
        const n = vals.length, dx = [], dy = [], m = [];
        for (let i = 0; i < n - 1; i++) { dx.push(x(i + 1) - x(i)); dy.push(vals[i + 1] - vals[i]); }
        for (let i = 0; i < n; i++) {
          const a = i > 0 ? dy[i - 1] / dx[i - 1] : dy[0] / dx[0];
          const b = i < n - 1 ? dy[i] / dx[i] : dy[n - 2] / dx[n - 2];
          m.push(a * b <= 0 ? 0 : (a + b) / 2);
        }
        let d = 'M' + x(0).toFixed(2) + ' ' + y(vals[0]).toFixed(2);
        for (let i = 0; i < n - 1; i++) {
          const x0 = x(i), x1 = x(i + 1), h = x1 - x0;
          d += ' C' + (x0 + h / 3).toFixed(2) + ' ' + (y(vals[i]) + m[i] * h / 3).toFixed(2) +
               ' ' + (x1 - h / 3).toFixed(2) + ' ' + (y(vals[i + 1]) - m[i + 1] * h / 3).toFixed(2) +
               ' ' + x1.toFixed(2) + ' ' + y(vals[i + 1]).toFixed(2);
        }
        return d;
      }

      function renderTrend() {
        const W = 620, H = 190, L = 32, R = 40, T = 12, B = 24;
        const iw = W - L - R, ih = H - T - B;
        const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': '召回率与延迟' });
        const x = (i) => L + (iw * i) / (TREND.length - 1);
        const yR = (v) => T + ih * (1 - (v - 0.8) / 0.2);
        const yL = (v) => T + ih * (1 - (v - 320) / 200);
        const defs = svgEl('defs', {});
        const lg = svgEl('linearGradient', { id: 'tf', x1: 0, y1: 0, x2: 0, y2: 1 });
        lg.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#4d6bfe', 'stop-opacity': 0.14 }));
        lg.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#4d6bfe', 'stop-opacity': 0 }));
        defs.appendChild(lg); svg.appendChild(defs);
        [0.8,0.85,0.9,0.95,1].forEach((v) => {
          svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: yR(v), y2: yR(v), stroke: '#f2f2f2' }));
          const t = svgEl('text', { x: L - 6, y: yR(v) + 3.5, 'text-anchor': 'end', 'font-size': 9, fill: '#9a9a9a' });
          t.textContent = v.toFixed(1); svg.appendChild(t);
        });
        const area = smooth(TREND, x, yR) + ' L' + x(TREND.length - 1).toFixed(2) + ' ' + (T + ih) + ' L' + x(0).toFixed(2) + ' ' + (T + ih) + ' Z';
        svg.appendChild(svgEl('path', { d: area, fill: 'url(#tf)' }));
        svg.appendChild(svgEl('path', { d: smooth(LAT, x, yL), fill: 'none', stroke: '#d5d5d5', 'stroke-width': 1.2 }));
        svg.appendChild(svgEl('path', { d: smooth(TREND, x, yR), fill: 'none', stroke: '#4d6bfe', 'stroke-width': 1.8, 'stroke-linecap': 'round' }));
        [0,8,16,23].forEach((i) => {
          const t = svgEl('text', { x: x(i), y: H - 7, 'text-anchor': 'middle', 'font-size': 9, fill: '#9a9a9a' });
          t.textContent = String(i).padStart(2, '0') + ':00'; svg.appendChild(t);
        });
        const hover = svgEl('g', { opacity: 0 });
        const vl = svgEl('line', { y1: T, y2: T + ih, stroke: '#e8e8e8' });
        const dot = svgEl('circle', { r: 3.4, fill: '#4d6bfe', stroke: '#fff', 'stroke-width': 1.5 });
        hover.appendChild(vl); hover.appendChild(dot); svg.appendChild(hover);
        const hit = svgEl('rect', { x: L, y: T, width: iw, height: ih, fill: 'transparent' });
        hit.addEventListener('mousemove', (e) => {
          const b = svg.getBoundingClientRect();
          let i = Math.round((((e.clientX - b.left) / b.width) * W - L) / iw * (TREND.length - 1));
          i = Math.max(0, Math.min(TREND.length - 1, i));
          vl.setAttribute('x1', x(i)); vl.setAttribute('x2', x(i));
          dot.setAttribute('cx', x(i)); dot.setAttribute('cy', yR(TREND[i]));
          hover.setAttribute('opacity', 1);
        });
        hit.addEventListener('mouseleave', () => hover.setAttribute('opacity', 0));
        svg.appendChild(hit);
        const host = document.getElementById('trend');
        host.innerHTML = ''; host.appendChild(svg);
      }

      function renderDonut() {
        const S = 150, cx = S / 2, cy = S / 2, r = 48, w = 17;
        const svg = svgEl('svg', { viewBox: '0 0 ' + S + ' ' + S, role: 'img', 'aria-label': '切分策略', style: 'max-width:150px;margin:0 auto' });
        let a0 = -Math.PI / 2;
        DONUT.forEach(([, pct, color]) => {
          const a1 = a0 + (pct / 100) * Math.PI * 2;
          const p = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
          const [x0, y0] = p(a0), [x1, y1] = p(a1);
          svg.appendChild(svgEl('path', {
            d: 'M ' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + (pct > 50 ? 1 : 0) + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1),
            fill: 'none', stroke: color, 'stroke-width': w,
          }));
          a0 = a1;
        });
        const t1 = svgEl('text', { x: cx, y: cy + 2, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 600, fill: '#1a1a1a' });
        t1.textContent = '55%'; svg.appendChild(t1);
        const host = document.getElementById('donut');
        host.innerHTML = ''; host.appendChild(svg);
        const lg = document.getElementById('donutLegend');
        lg.innerHTML = '';
        DONUT.forEach(([n, pct, color]) => {
          const s = el('span'); const i = el('i'); i.style.background = color;
          s.appendChild(i); s.appendChild(document.createTextNode(n + ' ' + pct + '%'));
          lg.appendChild(s);
        });
      }

      function renderRows() {
        const tb = document.getElementById('rows');
        ROWS.forEach((r) => {
          const tr = el('tr');
          tr.appendChild(el('td', 'q', r[0]));
          tr.appendChild(el('td', null, r[1]));
          tr.appendChild(el('td', 'num', r[2]));
          tr.appendChild(el('td', 'num', r[3]));
          tb.appendChild(tr);
        });
      }

      /* 手机第一屏：概览。分段切换「指标 / 样本」 */
      const M_SEG = ['指标', '样本'];
      const M_METRICS = [
        ['召回率 @10', '0.913', '+1.8%'],
        ['P95 延迟', '412', '−36ms'],
        ['重排命中率', '0.768', '−0.9%'],
      ];
      let mView = '指标';
      function renderMobile() {
        const seg = document.getElementById('m-seg');
        seg.innerHTML = '';
        M_SEG.forEach((k) => {
          const b = el('button', null, k);
          if (k === mView) b.setAttribute('aria-current', 'true');
          b.onclick = () => { mView = k; renderMobile(); };
          seg.appendChild(b);
        });
        const host = document.getElementById('m-view');
        host.innerHTML = '';
        if (mView === '指标') {
          M_METRICS.forEach(([k, v, d], idx) => {
            const tile = el('div', 'tile');
            const t = el('div', 't');
            t.appendChild(el('span', null, k));
            t.appendChild(el('span', null, d));
            tile.appendChild(t);
            const big = el('div', 'big', v);
            if (idx === 1) big.appendChild(el('small', null, 'ms'));
            tile.appendChild(big);
            host.appendChild(tile);
          });
          const tl = el('div', 'tile');
          tl.appendChild(el('div', 't', '最近同步'));
          ['索引重建完成|2 分钟前', '召回策略已更新|1 小时前', '评测集扩到 1,200 条|昨天'].forEach((s) => {
            const [n, m] = s.split('|');
            const row = el('div', 'row');
            row.appendChild(el('div', 'nm', n));
            row.appendChild(el('div', 'val', m));
            tl.appendChild(row);
          });
          host.appendChild(tl);
        } else {
          ROWS.slice(0, 3).forEach((r) => {
            const row = el('div', 'row');
            const l = el('div');
            l.appendChild(el('div', 'nm', r[0]));
            l.appendChild(el('div', 'sub', r[1] + ' 切分'));
            row.appendChild(l);
            const chip = el('span', 'chip' + (Number(r[2]) < 0.42 ? '' : ' warn'), r[2]);
            row.appendChild(chip);
            host.appendChild(row);
          });
        }
      }

      /* 手机第二屏：样本列表 */
      function renderMobileList() {
        const host = document.getElementById('m-list');
        ROWS.forEach((r) => {
          const row = el('div', 'row');
          const l = el('div');
          l.appendChild(el('div', 'nm', r[0]));
          l.appendChild(el('div', 'sub', r[1] + ' 切分 · ' + r[3]));
          row.appendChild(l);
          const chip = el('span', 'chip' + (Number(r[2]) < 0.42 ? '' : ' warn'), r[2]);
          row.appendChild(chip);
          host.appendChild(row);
        });
      }

      renderTrend(); renderDonut(); renderRows(); renderMobile(); renderMobileList();
      const clock = document.getElementById('clock');
      const tick = () => { clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }); };
      tick(); setInterval(tick, 1000);
    })();
    </script>
  </body>
