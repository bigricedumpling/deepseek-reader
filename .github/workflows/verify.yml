name: Typocket verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:access
      - run: npm run test:readonly
      - run: npm run test:block
      - run: npm run test:fold
      - run: npm run test:routes
      - run: npm run test:plugin
      - run: npm run test:lifecycle
      - run: npm run test:transfer
      - run: node scripts/test-workspace.mjs
      - run: node scripts/test-recovery.mjs
      - run: node scripts/test-draft-lifecycle.mjs
      - run: node scripts/test-preserved-markdown.mjs
      - run: npm run test:user-recovery
      - run: npm run test:conflict
      - run: npm run test:activity
      - run: node scripts/test-tooltip-input.mjs
      - run: npm run test:workflow
      - name: Browser editing regression
        if: runner.os == 'Linux'
        run: npm run regression
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Export a document from the built application
        if: runner.os == 'Linux'
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          node scripts/e2e/export-release.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm pack --pack-destination ../../
        working-directory: plugins/reader-workspace
      - run: node scripts/test-package.mjs
      - name: Upgrade from the published market package
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --output "$READER_UPGRADE_BASELINE" "$BASELINE_URL"
          npm run test:upgrade
        env:
          BASELINE_URL: https://github.com/bigricedumpling/deepseek-reader/releases/download/v0.2.0-preview.6/dsh-reader-workspace-0.2.0-preview.6.tgz
          READER_UPGRADE_BASELINE: ${{ runner.temp }}/typocket-previous-market.tgz
          READER_UPGRADE_BASELINE_SHA256: aaf9191b561d6bfe82fd112a132b3bb6e32fd0b452444eff1f6b23de00410e0e
