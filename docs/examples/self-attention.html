<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-attention</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --ink: #252a36;
      --slate: #535a6b;
      --faint: #727681;
      --blue: #394b86;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.42 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: calc(100% - 76px);
      max-width: 830px;
      margin: auto;
      padding: 34px 0 24px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font: normal 37px/1.05 var(--serif);
      letter-spacing: -1.25px;
    }

    .formula {
      color: var(--slate);
      font: italic 17px/1.25 var(--serif);
      white-space: nowrap;
    }

    .sentence {
      margin: 13px 0 0;
      color: var(--slate);
      font: italic 19px/1.4 var(--serif);
    }

    .figure {
      display: grid;
      grid-template-columns: minmax(310px, 1.42fr) minmax(205px, .92fr);
      align-items: start;
      gap: clamp(34px, 6vw, 78px);
      margin-top: 32px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-spacing: 4px;
    }

    th, td { padding: 0; }

    thead th {
      color: var(--slate);
      font: 15px/1.3 var(--serif);
      padding-bottom: 3px;
    }

    .axes {
      width: 14%;
      color: var(--faint);
      text-align: left;
      font: 12px var(--sans);
    }

    .query {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      width: 100%;
      min-height: 38px;
      border: 0;
      padding: 0 8px 0 0;
      background: transparent;
      color: var(--slate);
      font: 15px/1.3 var(--serif);
      cursor: pointer;
    }

    .query[aria-pressed="true"] {
      color: var(--blue);
      font-weight: bold;
    }

    .query[aria-pressed="true"]::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
    }

    .cell {
      display: block;
      width: 100%;
      height: 47px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      cursor: pointer;
    }

    .query:focus-visible, .cell:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .cell:hover {
      outline: 1px solid var(--blue);
      outline-offset: -1px;
    }

    aside { padding-top: 22px; }

    h2 {
      margin: 0 0 19px;
      font: normal 24px/1.1 var(--serif);
      letter-spacing: -.65px;
    }

    h2 em { color: var(--blue); }

    #weights {
      display: grid;
      gap: 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #weights li {
      display: grid;
      grid-template-columns: 43px minmax(35px, 1fr) 47px;
      align-items: center;
      gap: 10px;
      color: var(--slate);
    }

    .word { font: 15px/1 var(--serif); }

    .track {
      height: 5px;
      background: #e9e8e7;
    }

    .fill {
      display: block;
      height: 100%;
      background: #7b87ab;
      transition: width 180ms ease;
    }

    .value {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .strongest .fill { background: var(--blue); }
    .strongest .word, .strongest .value { color: var(--blue); font-weight: 650; }

    footer {
      margin-top: 18px;
      color: #666b75;
      font: 13px/1.5 var(--sans);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 690px) {
      main { width: calc(100% - 32px); padding-top: 24px; }
      h1 { font-size: 30px; }
      .formula { font-size: 14px; }
      .sentence { font-size: 17px; }
      .figure { grid-template-columns: 1fr; gap: 20px; margin-top: 23px; }
      aside { padding-top: 0; }
      #weights { gap: 9px; }
      .cell { height: 38px; }
      thead th, .query, .word { font-size: 14px; }
      .query { gap: 3px; padding-right: 3px; }
    }

    @media (max-width: 370px) {
      header { align-items: flex-start; flex-direction: column; gap: 8px; }
      .axes { width: 18%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill { transition: none; }
    }

    @media (forced-colors: active) {
      .cell { border: 1px solid ButtonText; }
      .query[aria-pressed="true"] { outline: 1px solid Highlight; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Self-attention</h1>
      <span class="formula" aria-label="Softmax of Q K transpose divided by the square root of the key dimension">
        softmax(QK<sup>⊤</sup> / √d<sub>k</sub>)
      </span>
    </header>
    <p class="sentence">The crane spread its wings.</p>
    <section class="figure" aria-label="Attention matrix and selected query weights">
      <table>
        <caption class="visually-hidden">Attention weights, with queries in rows and keys in columns.</caption>
        <thead><tr id="columns"><th class="axes" scope="col">Q / K</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <aside aria-labelledby="weight-title">
        <h2 id="weight-title">Weights from <em id="selected"></em></h2>
        <ol id="weights"></ol>
        <span class="visually-hidden" role="status" id="summary"></span>
      </aside>
    </section>
    <footer>Select a query row. Weights are computed from illustrative vectors.</footer>
    <noscript>Enable JavaScript to calculate and explore the attention weights.</noscript>
  </main>

  <script type="module">
    // Each word has a three-dimensional query and key, chosen for this illustration.
    const tokens = ["The", "crane", "spread", "its", "wings"];
    const queries = [
      [0.30, 0.10, 1.60], [1.00, 0.70, 0.10], [-0.40, 2.10, -0.25],
      [1.95, -0.35, 0.25], [0.55, 1.30, -0.60]
    ];
    const keys = [
      [0.50, 0.35, 1.00], [2.40, 0.10, 0.50], [-0.20, 2.10, 0.20],
      [0.80, 0.10, 1.50], [1.10, 1.10, -0.80]
    ];

    function attentionWeights(query) {
      const scale = Math.sqrt(query.length);
      const scores = keys.map(key =>
        key.reduce((sum, value, i) => sum + value * query[i], 0) / scale
      );
      const maximum = Math.max(...scores);
      const exponentials = scores.map(score => Math.exp(score - maximum));
      const sum = exponentials.reduce((total, value) => total + value, 0);
      return exponentials.map(value => value / sum);
    }

    const matrix = queries.map(attentionWeights);
    const maximumWeight = Math.max(...matrix.flat());
    const percent = value => (value * 100).toFixed(1) + "%";

    function cellColour(weight) {
      const intensity = Math.sqrt(weight / maximumWeight);
      const paper = [241, 240, 237], ink = [49, 66, 121];
      const rgb = paper.map((value, i) => Math.round(value + (ink[i] - value) * intensity));
      return "rgb(" + rgb.join(",") + ")";
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    const columns = document.getElementById("columns");
    const rows = document.getElementById("rows");
    const weights = document.getElementById("weights");
    const queryButtons = [];
    const valueRows = [];

    for (const token of tokens) {
      const header = element("th", "", token);
      header.scope = "col";
      columns.append(header);

      const item = element("li");
      const track = element("span", "track");
      const fill = element("span", "fill");
      const value = element("span", "value");
      track.setAttribute("aria-hidden", "true");
      track.append(fill);
      item.append(element("span", "word", token), track, value);
      weights.append(item);
      valueRows.push({ item, fill, value });
    }

    function selectQuery(row) {
      const values = matrix[row];
      const strongest = values.indexOf(Math.max(...values));
      document.getElementById("selected").textContent = tokens[row];
      queryButtons.forEach((button, i) => button.setAttribute("aria-pressed", String(i === row)));
      values.forEach((weight, i) => {
        const { item, fill, value } = valueRows[i];
        item.classList.toggle("strongest", i === strongest);
        fill.style.width = (weight * 100) + "%";
        value.textContent = percent(weight);
      });
      document.getElementById("summary").textContent =
        "Query " + tokens[row] + ". Highest weight: " + tokens[strongest] + ", " + percent(values[strongest]) + ".";
    }

    tokens.forEach((token, row) => {
      const tr = element("tr");
      const th = element("th");
      th.scope = "row";
      const button = element("button", "query", token);
      button.type = "button";
      button.addEventListener("click", () => selectQuery(row));
      button.addEventListener("keydown", event => {
        let next;
        if (event.key === "ArrowDown") next = (row + 1) % tokens.length;
        else if (event.key === "ArrowUp") next = (row + tokens.length - 1) % tokens.length;
        else return;
        event.preventDefault();
        queryButtons[next].focus();
        selectQuery(next);
      });
      queryButtons.push(button);
      th.append(button);
      tr.append(th);

      matrix[row].forEach((weight, column) => {
        const td = element("td");
        const cell = element("button", "cell");
        cell.type = "button";
        cell.tabIndex = -1; // Each row's labelled button provides the keyboard equivalent.
        cell.title = token + " → " + tokens[column] + "  " + percent(weight);
        cell.setAttribute("aria-label", cell.title);
        cell.dataset.weight = String(weight);
        cell.style.backgroundColor = cellColour(weight);
        cell.addEventListener("click", () => selectQuery(row));
        td.append(cell);
        tr.append(td);
      });
      rows.append(tr);
    });

    selectQuery(3);
  </script>
</body>
</html>
